<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用说明预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f5; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .toolbar {
    position: sticky; top: 0; z-index: 10;
    background: white; border-bottom: 1px solid #e0e0e0;
    padding: 12px 24px; display: flex; align-items: center; justify-content: space-between;
  }
  .toolbar h1 { font-size: 16px; color: #333; }
  .toolbar a {
    display: inline-block; padding: 8px 20px; background: #2E90FA; color: white;
    border-radius: 6px; text-decoration: none; font-size: 14px;
  }
  .toolbar a:hover { background: #1c7ed6; }
  .img-wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .img-wrap img { width: 100%; height: auto; display: block; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
</style>
</head>
<body>
  <div class="toolbar">
    <h1>机械效能采购小助手 · 使用说明 预览</h1>
    <a href="/guide.png" download="机械效能采购小助手_使用说明.png">下载图片</a>
  </div>
  <div class="img-wrap">
    <img src="/guide.png" alt="使用说明长图" />
  </div>
</body>
</html>
